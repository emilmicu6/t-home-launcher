name: build-apk

# Construiește APK-ul launcherului în cloud (nu ai nevoie de Android Studio).
# Rulezi manual din tab-ul Actions -> build-apk -> Run workflow, apoi descarci artefactul „tv-home-apk".
on:
  workflow_dispatch: {}
  push:
    paths: ['launcher/**']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: gradle -p launcher assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: tv-home-apk
          path: launcher/app/build/outputs/apk/debug/app-debug.apk
      - name: Commit APK to repo
        run: |
          mkdir -p dist
          cp launcher/app/build/outputs/apk/debug/app-debug.apk dist/app-debug.apk
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add dist/app-debug.apk
          git commit -m "Add built APK" || echo "nothing to commit"
          git push
